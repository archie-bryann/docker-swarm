---
services:
  nginx:
    image: docker.io/library/nginx:1.28.0-alpine
    # container_name: nginx
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          # - node.role == manager
          - node.hostname != ip-172-31-18-157 # vm-test-1
    secrets:
      - secret1
    configs:
      - source: nginx_config_file
        target: /etc/nginx/nginx_example.yaml
    environment:
      - API_TOKEN_FILE=/run/secrets/secret1
    ports:
      - 8082:80
      # - 80:80
      # - 443:443
    # volumes:
    #   - ./config/default.conf:/etc/nginx/conf.d/default.conf:ro
    #   - ./data/usr/share/nginx/html:ro
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.services.nginx.loadbalancer.server.port=80
    #   - traefik.http.routers.nginx.entrypoints=websecure
    #   - traefik.http.routers.nginx.rule=Host(`example.com`)
    #   - traefik.http.routers.nginx.tls=true
    #   - traefik.http.routers.nginx.tls.certresolver=cloudfare
    #   - traefik.http.routers.nginx.service=nginx
    networks:
      - proxy
    # restart: unless-stopped
networks:
  proxy:
    external: true

secrets:
  secret1:
    external: true

configs:
  nginx_config_file:
    external: true
