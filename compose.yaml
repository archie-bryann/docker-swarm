  nginx:
    image: docker.io/library/nginx:1.28.0-alpine
    # container_name: nginx
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          # - node.role == manager
          - node.hostname != ip-172-31-18-157 # vm-test-1
    ports:
      - 8082:80
